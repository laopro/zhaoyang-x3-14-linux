# zhaoyang-x3-14-linux -- Lenovo ZhaoYang X3-14 IRL (83GX) ONLY
# Optional cleanups. Neither affects S0ix; skip with: install.sh --no-modprobe

# HDA codec: power down after 1s of silence instead of 10s.
# Note: some distros (e.g. Fedora) override this at runtime via their own
# udev rules, leaving the effective value at 10. Harmless either way.
options snd_hda_intel power_save=1

# spd5118 (DDR5 SPD temperature sensor) fails on every resume with -6 on this
# board. It reports nothing useful on a laptop and only adds resume latency
# and log noise.
blacklist spd5118
